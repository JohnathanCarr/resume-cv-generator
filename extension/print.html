<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Resume</title>
    <style>
        /* The page itself (size, margins, the 8.5in page host) comes from
           preview/pageDoc.js PAGE_CSS, which print.js puts first in <head>;
           the preview and the page measurement use the same rules. */

        /* On screen: a grey desk with the page floating on it, plus a toolbar. */
        @media screen {
            html, body { background: #e5e7eb; }
            body { padding: 72px 24px 48px; font-family: -apple-system, system-ui, sans-serif; }
            .page-host { margin: 0 auto; background: white; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.18); }
            .toolbar {
                position: fixed; top: 0; left: 0; right: 0; z-index: 1;
                display: flex; align-items: center; gap: 12px;
                padding: 12px 24px; background: #111827; color: #f9fafb; font-size: 14px;
            }
            .toolbar .hint { flex: 1; opacity: 0.85; }
            .toolbar button {
                font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #4b5563;
                background: #1f2937; color: inherit; cursor: pointer;
            }
            .toolbar button.primary { background: #2563eb; border-color: #2563eb; }
            .toolbar button:hover { filter: brightness(1.15); }
        }
        @media print {
            .toolbar { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="hint">In the print dialog, set the destination to <strong>Save as PDF</strong>. This tab closes itself once you have saved.</span>
        <button id="print-again" class="primary">Save as PDF</button>
        <button id="close">Close</button>
    </div>
    <div id="page" class="page-host"></div>
    <script type="module" src="print.js"></script>
</body>
</html>
