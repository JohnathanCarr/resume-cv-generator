<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMOKE RUNNING</title>
<!--
  Smoke test: runs the real extension/app.html over a stubbed `chrome` API
  and a stubbed OpenAI, then clicks through the main flows the way a person
  would. Nothing is sent to OpenAI and nothing is billed. Run it with
  scripts/smoke.sh (headless Chrome), or open it in a browser from the
  repository root served over HTTP (python3 -m http.server 8790) and read the
  result at the bottom of the page.
-->
</head>
<body>
<script>
(async () => {
  // Everything the page needs is fetched before document.write: afterwards
  // the <base> points relative URLs at extension/.
  const [profile, sample, pdf, uploadPdf, html] = await Promise.all([
    fetch('../eval/profiles/maria_backend_ms.json').then(r => r.json()),
    fetch('../../store/sample-resume.json').then(r => r.json()),
    fetch('../fixtures/resume_sans_title_first.pdf').then(r => r.arrayBuffer()),
    fetch('../fixtures/resume_serif_company_first.pdf').then(r => r.arrayBuffer()),
    fetch('../../extension/app.html').then(r => r.text())
  ]);
  const bytes = new Uint8Array(pdf);
  let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));

  // ── Stubbed chrome API (records what the app asked for) ─────────────────
  const store = {
    profile,
    uploadedResume: { name: 'resume_sans_title_first.pdf', size: bytes.length, uploadedAt: '2026-09-01T00:00:00.000Z', dataBase64: btoa(binary) },
    onboarding: { seen: true, installedAt: '2026-09-01T00:00:00.000Z', completedAt: '2026-09-01T00:00:00.000Z' },
    apiKey: { value: 'sk-smoke-test', last4: 'test', savedAt: '2026-09-01T00:00:00.000Z', verifiedAt: '2026-09-01T00:00:00.000Z' },
    researchEnabled: false
  };
  const session = {};
  const calls = { downloads: [], tabs: [] };
  const pick = (area, keys) => Object.fromEntries((keys == null ? Object.keys(area) : Array.isArray(keys) ? keys : [keys]).filter(k => k in area).map(k => [k, area[k]]));
  window.chrome = {
    storage: {
      local: { get: async (k) => pick(store, k), set: async (o) => { Object.assign(store, o); }, remove: async (k) => { [].concat(k).forEach(x => delete store[x]); } },
      session: { get: async (k) => pick(session, k), set: async (o) => { Object.assign(session, o); }, remove: async (k) => { [].concat(k).forEach(x => delete session[x]); } }
    },
    runtime: { id: 'smoke', getURL: (p) => `../extension/${p}`, connect: () => ({ onDisconnect: { addListener() {} } }), lastError: undefined },
    downloads: { download: (opts, cb) => { calls.downloads.push(opts.filename); cb && cb(1); } },
    tabs: { create: async (opts) => { calls.tabs.push(opts.url); return { id: 2 }; } }
  };

  // ── Stubbed OpenAI: answers by the requested schema ─────────────────────
  // Two posting keywords the profile does not have, so the keyword dialog appears.
  const MISSING = ['Quokka DB', 'Zebra Orchestrator'];
  const stub = { failNext: false, requests: [] };
  const answers = {
    match_analysis: () => ({
      company: 'Northwind Labs', role: 'Backend Engineer', seniority: 'mid', location: 'Remote',
      about_company: 'Northwind Labs builds scheduling software for clinics.',
      requirements: [{ text: 'Backend services in Go', kind: 'required', evidence: [], strength: 'partial' }],
      keywords: [{ term: 'Go', importance: 'core' }, ...MISSING.map(term => ({ term, importance: 'core' }))]
    }),
    // The composer: the profile's own lines, each citing itself.
    resume_composition: () => {
      const p = store.profile;
      const entry = (kind) => (x) => ({ id: `${kind}:${x.id}`, bullets: (x.bullets || []).map((text, i) => ({ text, sources: [`${kind}:${x.id}.b${i + 1}`] })) });
      return {
        summary: { text: p.summary || '', sources: ['profile:summary'] },
        skill_groups: [{ label: 'Skills', items: (p.skills || []).slice(0, 8) }],
        experience: (p.experiences || []).map(entry('exp')),
        projects: (p.projects || []).filter(x => (x.bullets || []).length).map(entry('proj')),
        education: (p.education || []).map(e => ({ id: `edu:${e.id}` })),
        extras: (p.extras || []).map(e => ({ id: `extra:${e.id}` })),
        section_order: ['experience', 'projects', 'education', 'extras']
      };
    },
    cover_letter: () => ({
      coverLetter: 'I am applying for the Backend Engineer role at Northwind Labs.\n\nThe posting asks for backend services in Go, which is the work I do every day.',
      claims: [{ sentence: 'I am applying for the Backend Engineer role at Northwind Labs.', source: 'job posting' }]
    })
  };
  const realFetch = window.fetch.bind(window);
  window.fetch = async (url, init) => {
    if (!String(url).startsWith('https://api.openai.com/')) return realFetch(url, init);
    const body = JSON.parse(init.body);
    const name = body.response_format?.json_schema?.name;
    stub.requests.push(name || String(url));
    await new Promise(r => setTimeout(r, 300));   // a model call takes time
    if (stub.failNext) { stub.failNext = false; return new Response(JSON.stringify({ error: { message: 'Stubbed server error' } }), { status: 500 }); }
    if (!name && body.messages?.[0]?.content === 'Reply with the single word OK.') {
      return new Response(JSON.stringify({ model: body.model, choices: [{ finish_reason: 'stop', message: { content: 'OK' } }], usage: {} }), { status: 200 });
    }
    const answer = answers[name];
    if (!answer) return new Response(JSON.stringify({ error: { message: `No stub for ${name || url}` } }), { status: 400 });
    return new Response(JSON.stringify({ choices: [{ finish_reason: 'stop', message: { content: JSON.stringify(answer()) } }], usage: {} }), { status: 200, headers: { 'Content-Type': 'application/json' } });
  };

  // ── Console capture ─────────────────────────────────────────────────────
  const errors = [];
  const infos = [];
  let expectErrors = false;
  const origError = console.error.bind(console);
  console.error = (...a) => { if (!expectErrors) errors.push(a.map(String).join(' ')); origError(...a); };
  const origInfo = console.info.bind(console);
  console.info = (...a) => { infos.push(a.map(String).join(' ')); origInfo(...a); };
  window.addEventListener('error', e => errors.push(`uncaught: ${e.message}`));
  window.addEventListener('unhandledrejection', e => errors.push(`unhandled rejection: ${e.reason?.message || e.reason}`));

  // Open the app in place. Transitions off, as in store/screenshots.html.
  document.open();
  document.write(html.replace('<head>', '<head><base href="../../extension/"><style>*, *::before, *::after { transition: none !important; animation: none !important; }</style>'));
  document.close();

  // ── Helpers ─────────────────────────────────────────────────────────────
  const $ = (sel) => document.querySelector(sel);
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const visible = (id) => { const el = document.getElementById(id); return !!el && !el.classList.contains('hidden'); };
  // showError() hides Retry with style.display, not the hidden class.
  const retryShown = () => getComputedStyle(document.getElementById('retry-btn')).display !== 'none';
  const errorText = () => document.getElementById('error-message')?.textContent || '';
  async function waitFor(what, cond, timeout = 15000) {
    const start = Date.now();
    while (!cond()) {
      if (Date.now() - start > timeout) throw new Error(`timed out waiting for ${what}`);
      await sleep(50);
    }
  }
  const progressState = () => $('#gen-progress .progress-card')?.dataset.state;
  const progressHidden = () => $('#gen-progress')?.hidden;
  const pageInert = () => !!$('.job-input-section')?.inert;
  const status = () => $('#generation-status')?.textContent.trim() || '';
  const results = [];
  async function check(name, fn) {
    const errorsBefore = errors.length;
    try {
      await fn();
      if (errors.length > errorsBefore) throw new Error(`console errors: ${errors.slice(errorsBefore).join(' | ')}`);
      results.push({ name, ok: true });
    } catch (e) {
      results.push({ name, ok: false, error: e.message });
      // A failed check must not leave a dialog open for the next one to find.
      document.querySelectorAll('.modal:not(.hidden) .modal-close').forEach(b => b.click());
      document.querySelector('.tour-skip')?.click();
      await sleep(200);
    }
  }
  const assert = (cond, msg) => { if (!cond) throw new Error(msg); };

  // Same offscreen render as app.js measureResumeHeight(): the tailored page
  // at print width with its min-height dropped.
  function measurePage() {
    const page = $('.resume-content .resume-page');
    if (!page) return null;
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-10000px;top:0;width:8.5in;visibility:hidden;pointer-events:none;';
    host.innerHTML = page.outerHTML;
    document.body.appendChild(host);
    const copy = host.querySelector('.resume-page');
    copy.style.minHeight = '0';
    const h = copy.getBoundingClientRect().height;
    host.remove();
    return Math.round(h * 10) / 10;
  }

  // ── Scenarios ───────────────────────────────────────────────────────────
  let pageHeight = null;
  await waitFor('the app to start', () => $('#job-text') && document.getElementById('theme-toggle'));
  await sleep(600);

  await check('app starts without errors', async () => {
    assert(document.title === 'Resume Studio', `title is "${document.title}"`);
    assert(!$('#loading-overlay'), 'old loading overlay is back');
    assert(progressHidden(), 'progress strip visible before any generation');
  });

  await check('checklist shows what is left (first document not generated yet)', async () => {
    assert(visible('getting-started'), 'checklist hidden');
    const done = (item) => $(`#getting-started li[data-item="${item}"]`).classList.contains('done');
    assert(done('resume') && done('name') && done('key'), 'resume, name or key not ticked');
    assert(!done('generated'), 'generated ticked before any generation');
  });

  await check('theme toggles and comes back', async () => {
    const before = document.documentElement.dataset.theme;
    $('#theme-toggle').click();
    assert(document.documentElement.dataset.theme !== before, 'theme did not change');
    assert($('#theme-toggle').getAttribute('aria-pressed') === String(document.documentElement.dataset.theme === 'dark'), 'aria-pressed out of step');
    $('#theme-toggle').click();
    assert(document.documentElement.dataset.theme === before, 'theme did not change back');
  });

  await check('settings opens and Escape closes it', async () => {
    $('#open-settings').focus();
    $('#open-settings').click();
    await waitFor('settings', () => visible('settings-modal'));
    document.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await waitFor('settings to close', () => !visible('settings-modal'));
    assert(document.activeElement === $('#open-settings'), 'focus did not return to the Settings button');
  });

  await check('dialogs: Tab stays inside, a backdrop click closes', async () => {
    $('#open-settings').click();
    await waitFor('settings', () => visible('settings-modal'));
    const modal = document.getElementById('settings-modal');
    assert(modal.contains(document.activeElement), 'focus not moved into the dialog');
    const items = [...modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter(n => !n.disabled && n.getClientRects().length);
    items.at(-1).focus();
    document.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
    assert(document.activeElement === items[0], 'Tab from the last control did not wrap to the first');
    document.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: 'Tab', shiftKey: true, bubbles: true, cancelable: true }));
    assert(document.activeElement === items.at(-1), 'Shift+Tab from the first control did not wrap to the last');
    modal.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    await waitFor('settings to close on backdrop click', () => !visible('settings-modal'));
  });

  await check('error without Retry can be closed (empty posting)', async () => {
    $('[data-tab="generate"]').click();
    $('#job-text').value = '';
    $('#generate-btn').click();
    await waitFor('error dialog', () => visible('error-modal'));
    const shown = retryShown();
    $('#error-close').click();
    assert(!shown, 'Retry shown for a validation error');
    await waitFor('error dialog to close', () => !visible('error-modal'));
  });

  // The stubbed analysis returns MISSING as core keywords; cleanMatch() keeps
  // only keywords the posting really contains, so the posting names them.
  $('#job-text').value = `${sample.jobText}\n\nAlso required: ${MISSING.join(', ')}.`;

  await check('resume: keyword dialog, Continue with none ticked, done', async () => {
    $('#generate-resume-btn').click();
    await waitFor('keyword dialog', () => visible('keywords-modal'), 30000);
    assert(progressState() === 'running' && !progressHidden(), 'progress strip not running');
    const chips = [...document.querySelectorAll('#keywords-list .keyword-chip')].map(c => c.textContent.trim());
    assert(MISSING.every(k => chips.includes(k)), `chips were ${chips.join(', ')}`);
    $('#keywords-continue').click();
    await waitFor('resume to finish', () => progressState() === 'done', 30000);
    assert($('.resume-content .resume-page'), 'no resume page in the preview');
    assert(!document.getElementById('download-resume-pdf').disabled, 'Resume PDF still disabled');
    assert(!pageInert(), 'page still inert');
    await waitFor('strip to hide after Done', () => progressHidden(), 3000);
    const line = infos.find(l => l.startsWith('[timing] resume done'));
    assert(line && /compose \d/.test(line) && /read posting \d/.test(line), `timing line missing: ${line}`);
    assert(stub.requests.includes('resume_composition'), `the composer was not called: ${stub.requests.join(', ')}`);
    const report = $('#resume-match .match-report');
    assert(report && !$('#resume-match').classList.contains('hidden'), 'no match report');
    assert(report.textContent.includes('Backend services in Go') && report.textContent.includes('Quokka DB'), `match report incomplete: ${report.textContent.slice(0, 200)}`);
    pageHeight = measurePage();
    assert(!visible('getting-started'), 'checklist still shown after the first document');
    assert(store.onboarding.firstGeneratedAt, 'first generation not recorded');
  });

  await check('resume PDF: file name dialog, then print view', async () => {
    $('#download-resume-pdf').click();
    await waitFor('file name dialog', () => visible('filename-modal'));
    assert(/Resume/.test($('#filename-input').value), `file name was "${$('#filename-input').value}"`);
    $('#filename-save').click();
    await waitFor('print view to open', () => calls.tabs.length === 1);
    assert(session.printJob?.html?.includes('resume-page'), 'no print job in session storage');
    assert(!session.printJob.html.includes('rs-added'), 'highlights reached the PDF');
  });

  let printCheck = null;
  await check('resume page is parse-safe (order, headings, no tables, images or ligatures)', async () => {
    const { pageProblems, textProblems } = await import('/extension/preview/parseSafety.js');
    const page = $('.resume-content .resume-page');
    // What the runner checks in the PDF Chrome prints from the same markup
    // (set first, so the PDF is checked even when the page check fails).
    const holder = document.createElement('div');
    holder.innerHTML = session.printJob.html;
    const header = page.querySelector('.resume-header');
    printCheck = {
      html: session.printJob.html,
      headings: [...holder.querySelectorAll('h2')].map(h => h.textContent.trim()),
      mustContain: [header.querySelector('h1').textContent.trim(), ...header.querySelector('div').textContent.split('|').map(t => t.trim()).filter(Boolean)]
    };
    const problems = [...pageProblems(page), ...textProblems(page.innerText)];
    assert(!problems.length, problems.join('; '));
  });

  await check('file name: Enter saves with the typed name', async () => {
    $('#download-resume-pdf').click();
    await waitFor('file name dialog', () => visible('filename-modal'));
    $('#filename-input').value = 'My: Resume?';
    $('#filename-input').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    await waitFor('print view to open', () => calls.tabs.length === 2);
    assert(session.printJob.title === 'My Resume', `title was "${session.printJob.title}"`);
    assert(!visible('filename-modal'), 'file name dialog still open');
  });

  await check('cover letter: Cancel in the keyword dialog stops the run', async () => {
    $('#generate-btn').click();
    await waitFor('keyword dialog', () => visible('keywords-modal'), 30000);
    $('#keywords-cancel').click();
    await waitFor('cancel', () => status() === 'Cancelled.');
    assert(progressHidden(), 'progress strip still visible after cancel');
    assert(!pageInert(), 'page still inert after cancel');
  });

  await check('cover letter: tick both keywords, done', async () => {
    $('#generate-btn').click();
    await waitFor('keyword dialog', () => visible('keywords-modal'), 30000);
    document.querySelectorAll('#keywords-list input').forEach(i => { i.checked = true; });
    $('#keywords-continue').click();
    await waitFor('letter to finish', () => progressState() === 'done', 30000);
    await waitFor('letter text', () => /Northwind Labs/.test($('.letter-content')?.textContent || ''));
    assert(!document.getElementById('download-pdf').disabled, 'Cover letter PDF still disabled');
    const skills = [...document.querySelectorAll('#skills-list .skill-tag')].map(t => t.firstChild.textContent);
    assert(MISSING.every(k => skills.includes(k)), 'ticked keywords not added to skills');
    const line = infos.find(l => l.startsWith('[timing] cover letter done'));
    assert(line && /cover letter \d.*\(letter \d/.test(line), `timing line missing: ${line}`);
  });

  await check('cover letter PDF: file name dialog, then download', async () => {
    $('#download-pdf').click();
    await waitFor('file name dialog', () => visible('filename-modal'));
    $('#filename-save').click();
    await waitFor('download', () => calls.downloads.length === 1);
    assert(/\.pdf$/.test(calls.downloads[0]), `download name was ${calls.downloads[0]}`);
  });

  await check('after a failed run, closing the error returns focus to Generate', async () => {
    expectErrors = true;
    stub.failNext = true;
    $('#generate-btn').focus();
    $('#generate-btn').click();
    await waitFor('error dialog', () => visible('error-modal') && errorText().includes('Stubbed server error'), 30000);
    expectErrors = false;
    $('#error-close').click();
    await waitFor('error dialog to close', () => !visible('error-modal'));
    await waitFor('page to unlock', () => !pageInert());
    assert(document.activeElement === $('#generate-btn'), `focus is on ${document.activeElement?.id || document.activeElement?.tagName}`);
  });

  await check('failure shows the error dialog, Retry succeeds', async () => {
    expectErrors = true;
    stub.failNext = true;
    $('#generate-btn').click();
    await waitFor('error dialog', () => visible('error-modal') && errorText().includes('Stubbed server error'), 30000);
    assert(progressState() === 'error' && !progressHidden(), 'strip not showing the failure');
    assert(retryShown(), 'no Retry button');
    expectErrors = false;
    $('#retry-btn').click();
    await waitFor('retry to finish', () => progressState() === 'done', 30000);
    assert(!visible('error-modal'), 'error dialog still open');
  });

  // Last, because it replaces the stored resume the measurement above used.
  await check('uploading a resume parses it into the profile', async () => {
    $('[data-tab="profile"]').click();
    const before = document.querySelectorAll('#experiences-container .experience-card').length;
    const input = document.getElementById('resume-file');
    const dt = new DataTransfer();
    dt.items.add(new File([uploadPdf], 'resume_serif_company_first.pdf', { type: 'application/pdf' }));
    input.files = dt.files;
    input.dispatchEvent(new Event('change', { bubbles: true }));
    await waitFor('the parse to finish', () => $('#profile-status')?.classList.contains('status-success'), 30000);
    assert(!/unavailable/.test($('#profile-status').textContent), 'parser reported unavailable');
    assert(store.uploadedResume.name === 'resume_serif_company_first.pdf', 'upload not stored');
    assert(store.baselineResume?.resume, 'no baseline snapshot saved');
    const after = document.querySelectorAll('#experiences-container .experience-card').length;
    assert(after > before, `no experience merged in (${before} → ${after})`);
  });

  const fire = (el, type, init = {}) => el.dispatchEvent(type === 'keypress' || type === 'keydown'
    ? new KeyboardEvent(type, { bubbles: true, cancelable: true, ...init })
    : new Event(type, { bubbles: true }));
  const type = (el, value) => { el.value = value; fire(el, 'input'); };
  const cards = (id) => [...document.querySelectorAll(`#${id} > div`)];

  await check('profile: add, edit and remove each kind of entry', async () => {
    $('[data-tab="profile"]').click();

    const exps = cards('experiences-container').length;
    $('#add-experience').click();
    let card = cards('experiences-container').at(-1);
    assert(cards('experiences-container').length === exps + 1, 'no experience card added');
    type(card.querySelector('[data-field="title"]'), 'Staff Engineer');
    type(card.querySelector('[data-field="company"]'), 'Acme');
    assert(store.profile.experiences.at(-1).title === 'Staff Engineer', 'experience title not saved');
    card.querySelector('.add-bullet').click();
    card = cards('experiences-container').at(-1);
    type(card.querySelector('input[data-bullet-index="0"]'), 'Led the platform team');
    assert(store.profile.experiences.at(-1).bullets[0] === 'Led the platform team', 'bullet not saved');
    const must = card.querySelector('.must-include-exp');
    must.checked = true; fire(must, 'change');
    assert(store.profile.experiences.at(-1).mustInclude === true, 'Must include not saved');
    card.querySelector('.bullet-remove').click();
    assert(store.profile.experiences.at(-1).bullets.length === 0, 'bullet not removed');
    cards('experiences-container').at(-1).querySelector('.remove-experience').click();
    assert(cards('experiences-container').length === exps && store.profile.experiences.length === exps, 'experience not removed');

    const edus = cards('education-container').length;
    $('#add-education').click();
    type(cards('education-container').at(-1).querySelector('[data-field="institution"]'), 'Night School');
    assert(store.profile.education.at(-1).institution === 'Night School', 'education not saved');
    cards('education-container').at(-1).querySelector('.remove-education').click();
    assert(store.profile.education.length === edus, 'education not removed');

    const projs = cards('projects-container').length;
    $('#add-project').click();
    card = cards('projects-container').at(-1);
    type(card.querySelector('[data-field="name"]'), 'tidepool');
    card.querySelector('.add-bullet').click();
    type(cards('projects-container').at(-1).querySelector('input[data-bullet-index="0"]'), 'A job queue');
    assert(store.profile.projects.at(-1).name === 'tidepool' && store.profile.projects.at(-1).bullets[0] === 'A job queue', 'project not saved');
    cards('projects-container').at(-1).querySelector('.remove-project').click();
    assert(store.profile.projects.length === projs, 'project not removed');

    const extras = cards('extras-container').length;
    $('#add-extra').click();
    card = cards('extras-container').at(-1);
    assert(store.profile.extras.at(-1).type === 'program', 'new extra not a program');
    const select = card.querySelector('select[data-field="type"]');
    assert(select.options.length === 9, `${select.options.length} extra types`);
    select.value = 'award'; fire(select, 'change');
    assert(store.profile.extras.at(-1).type === 'award', 'extra type not saved');
    card.querySelector('.remove-extra').click();
    assert(store.profile.extras.length === extras, 'extra not removed');
  });

  await check('profile: skills, name autosave and Save profile', async () => {
    const input = $('#skills-input');
    input.value = 'Erlang';
    fire(input, 'keypress', { key: 'Enter' });
    assert(store.profile.skills.includes('Erlang'), 'skill not saved');
    const tag = [...document.querySelectorAll('#skills-list .skill-tag')].find(t => t.firstChild.textContent === 'Erlang');
    assert(tag, 'skill tag missing');
    tag.querySelector('.skill-remove').click();
    assert(!store.profile.skills.includes('Erlang'), 'skill not removed');

    const original = store.profile.name;
    type($('#profile-name'), 'Maria L. Garcia');
    await waitFor('name autosave', () => store.profile.name === 'Maria L. Garcia', 3000);
    type($('#profile-name'), original);
    $('#save-profile').click();
    assert(status() === 'Profile saved successfully!', `status was "${status()}"`);
    await waitFor('name saved back', () => store.profile.name === original, 3000);
  });

  await check('settings: replace, cancel, remove, invalid and valid key', async () => {
    $('#open-settings').click();
    await waitFor('settings', () => visible('settings-modal'));
    assert(visible('api-key-saved') && !visible('api-key-entry'), 'saved key not shown');
    assert($('#api-key-masked').textContent === 'sk-••••••••••••test', `masked as ${$('#api-key-masked').textContent}`);
    assert(/^Verified /.test($('#api-key-status').textContent), `status ${$('#api-key-status').textContent}`);
    $('#api-key-replace').click();
    assert(visible('api-key-entry') && !visible('api-key-saved') && visible('api-key-cancel'), 'replace view wrong');
    $('#api-key-cancel').click();
    assert(visible('api-key-saved'), 'cancel did not go back');

    $('#api-key-remove').click();
    await waitFor('key removed', () => !('apiKey' in store) && visible('api-key-entry'));
    assert(!visible('api-key-cancel'), 'cancel shown with no key');
    $('#settings-close').click();
    await waitFor('settings closed', () => !visible('settings-modal'));
    assert(visible('getting-started') && !$('#getting-started li[data-item="key"]').classList.contains('done'), 'checklist did not come back without a key');
    $('[data-tab="generate"]').click();
    $('#generate-btn').click();
    await waitFor('missing key error', () => visible('error-modal') && /Add your OpenAI API key/.test(errorText()));
    $('#error-close').click();

    $('#open-settings').click();
    await waitFor('settings', () => visible('settings-modal'));
    $('#api-key-input').value = 'not-a-key';
    $('#api-key-save').click();
    await waitFor('invalid key error', () => visible('error-modal') && /does not look like an OpenAI API key/.test(errorText()));
    $('#error-close').click();
    await waitFor('error closed', () => !visible('error-modal'));
    $('#api-key-input').value = 'sk-smoke-replacement-key';
    fire($('#api-key-input'), 'keydown', { key: 'Enter' });
    await waitFor('key verified', () => store.apiKey?.last4 === '-key' && store.apiKey.verifiedAt, 5000);
    await waitFor('status shows it', () => visible('api-key-saved') && /^Verified /.test($('#api-key-status').textContent));
    $('#settings-close').click();
    await waitFor('settings closed', () => !visible('settings-modal'));
    assert(!visible('getting-started'), 'checklist still shown with everything done');
  });

  await check('checklist can be dismissed', async () => {
    store.onboarding.firstGeneratedAt = null;   // bring it back
    $('[data-tab="generate"]').click();
    $('[data-tab="profile"]').click();
    assert(visible('getting-started'), 'checklist not shown');
    $('#checklist-dismiss').click();
    assert(!visible('getting-started') && store.onboarding.checklistDismissed === true, 'checklist not dismissed');
  });

  await check('guided tour: Next through every step, then Finish', async () => {
    $('#help-tour').click();
    await waitFor('tour', () => $('.tour-tooltip'));
    const titles = [];
    for (let i = 0; i < 10 && $('.tour-tooltip'); i++) {
      titles.push($('.tour-title').textContent);
      assert($('.tour-progress').textContent === `${i + 1} / 7`, `progress ${$('.tour-progress').textContent}`);
      $('.tour-next').click();
      await sleep(100);
    }
    assert(titles.length === 7, `${titles.length} steps`);
    assert(titles[0] === 'Welcome to Resume Studio' && titles[6] === 'Generate and download', `titles ${titles.join(' | ')}`);
    assert($('#tab-profile').getAttribute('aria-selected') === 'true', 'did not return to the Profile tab');
    assert(store.onboarding.seen === true && store.onboarding.skipped === false, 'tour completion not saved');
  });

  await check('guided tour opens and Escape exits', async () => {
    $('#help-tour').click();
    await waitFor('tour', () => $('.tour-tooltip'));
    document.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await waitFor('tour to close', () => !$('.tour-tooltip'));
  });

  // ── Report ──────────────────────────────────────────────────────────────
  const failed = results.filter(r => !r.ok).length;
  const report = { ok: failed === 0, passed: results.length - failed, failed, pageHeight, printCheck, results, openaiRequests: stub.requests, timing: infos.filter(l => l.startsWith('[timing]')) };
  const pre = document.createElement('pre');
  pre.id = 'smoke-result';
  pre.textContent = `SMOKE_RESULT_BEGIN${JSON.stringify(report)}SMOKE_RESULT_END`;
  document.body.appendChild(pre);
  document.title = failed ? 'SMOKE FAIL' : 'SMOKE PASS';
})().catch(e => {
  const pre = document.createElement('pre');
  pre.id = 'smoke-result';
  pre.textContent = `SMOKE_RESULT_BEGIN${JSON.stringify({ ok: false, fatal: String(e && e.stack || e) })}SMOKE_RESULT_END`;
  document.body.appendChild(pre);
  document.title = 'SMOKE FAIL';
});
</script>
</body>
</html>
